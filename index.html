<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>🎧 Luna's Audio Mixer</h1>
      <p class="subtitle">Low-latency routing, monitoring, and mix control</p>
    </header>

    <div id="statusStrip">
      <span id="statusText">Ready</span>
      <span id="saveStateText">All changes saved</span>
    </div>

    <section class="panel routing-panel">
      <h2>Routing</h2>
      <div class="device-grid">
        <label class="field">
          <span>Input Source 1</span>
          <select id="input1"></select>
        </label>
        <label class="field">
          <span>Input Source 2</span>
          <select id="input2"></select>
        </label>
        <label class="field">
          <span>Input Source 3</span>
          <select id="input3"></select>
        </label>
        <label class="field">
          <span>Monitor Output Device</span>
          <select id="monitorDevice"></select>
        </label>
        <label class="field">
          <span>Monitor 2 Output Device</span>
          <select id="monitor2Device"></select>
        </label>
        <label class="field">
          <span>Mixed Output Device</span>
          <select id="mixedOutputDevice"></select>
        </label>
      </div>
      <div class="button-row">
        <button id="refreshAppSources" title="Rescan running applications that can be captured as input sources (Windows 10 2004+)">Refresh Applications</button>
      </div>
    </section>

    <section id="presetControls" class="panel">
      <h2>Presets</h2>
      <div class="preset-row">
        <label class="field compact-field">
          <span>Preset</span>
          <select id="presetSelect">
            <option value="">(None)</option>
          </select>
        </label>
        <label class="field compact-field">
          <span>Name</span>
          <input type="text" id="presetName" placeholder="My Preset" maxlength="40">
        </label>
      </div>
      <div class="button-row">
        <button id="presetSave">Save / Update</button>
        <button id="presetLoad">Load</button>
        <button id="presetDelete">Delete</button>
        <label class="toggle-inline">
          <input type="checkbox" id="compactModeToggle"> Compact Mode
        </label>
      </div>
    </section>

    <section class="panel master-panel">
      <h2>Master Controls</h2>
      <label class="slider-row">Monitor Master Volume:
        <input type="range" id="monitorMaster" min="0" max="1" step="0.01" value="1">
        <span id="monitorMasterDisplay">100%</span>
      </label>
      <label class="slider-row">Monitor 2 Master Volume:
        <input type="range" id="monitor2Master" min="0" max="1" step="0.01" value="1">
        <span id="monitor2MasterDisplay">100%</span>
      </label>
      <label class="slider-row">Output Master Volume:
        <input type="range" id="outputMaster" min="0" max="1" step="0.01" value="1">
        <span id="outputMasterDisplay">100%</span>
      </label>
      <div id="masterMeters">
        <div class="master-meter">
          <span>Monitor Level</span>
          <div class="meterTrack"><div id="monitorMeterFill" class="meterFill"></div></div>
          <span class="meterMeta"><span id="monitorMeterText" class="meterValue">0.0 dB</span><span id="monitorClip" class="clipIndicator">CLIP</span></span>
        </div>
        <div class="master-meter">
          <span>Monitor 2 Level</span>
          <div class="meterTrack"><div id="monitor2MeterFill" class="meterFill"></div></div>
          <span class="meterMeta"><span id="monitor2MeterText" class="meterValue">0.0 dB</span><span id="monitor2Clip" class="clipIndicator">CLIP</span></span>
        </div>
        <div class="master-meter">
          <span>Output Level</span>
          <div class="meterTrack"><div id="outputMeterFill" class="meterFill"></div></div>
          <span class="meterMeta"><span id="outputMeterText" class="meterValue">0.0 dB</span><span id="outputClip" class="clipIndicator">CLIP</span></span>
        </div>
      </div>
    </section>

    <section id="advancedControls" class="panel collapsible-panel">
      <details>
        <summary>🎛️ Advanced Controls</summary>
        <div class="advanced-group">
          <label class="advanced-toggle">
            <input type="checkbox" id="startOnBootToggle"> Start app on system boot
          </label>
          <label class="advanced-toggle">
            <input type="checkbox" id="showMultichannelDevices"> Show input/output devices with more than 2 channels
          </label>
          <label class="advanced-toggle">
            <input type="checkbox" id="enforceRoutingSafetyToggle"> Enforce routing safety restrictions (duplicates + cable loop guard)
          </label>
          <label>EQ Preset:
            <select id="eqPresetSelect">
              <option value="flat">Flat (Built-in)</option>
              <option value="voice">Voice Clarity (Built-in)</option>
              <option value="broadcast">Broadcast Warmth (Built-in)</option>
              <option value="bright">Bright Presence (Built-in)</option>
              <option value="bassheavy">Bass Heavy (Built-in)</option>
            </select>
          </label>
          <label>EQ Preset Name:
            <input type="text" id="eqPresetName" placeholder="My EQ" maxlength="40">
          </label>
          <div class="button-row">
            <button id="eqPresetSave">Save EQ Preset</button>
            <button id="eqPresetDelete">Delete Selected EQ Preset</button>
          </div>
          <label>Low:
            <input type="range" id="eqLowControl" min="-12" max="12" step="0.1" value="0">
            <span id="eqLowDisplay">0.0 dB</span>
          </label>
          <label>Mid:
            <input type="range" id="eqMidControl" min="-12" max="12" step="0.1" value="0">
            <span id="eqMidDisplay">0.0 dB</span>
          </label>
          <label>High:
            <input type="range" id="eqHighControl" min="-12" max="12" step="0.1" value="0">
            <span id="eqHighDisplay">0.0 dB</span>
          </label>
          <label>*OVERLOAD* (Post-Mix Gain):
            <input type="range" id="overloadControl" min="1" max="3" step="0.01" value="1">
            <span id="overloadDisplay">100%</span>
          </label>
          <label title="Smoothly saturates peaks instead of hard-cutting at 0 dBFS. Applied at the end of each output bus.">
            <input type="checkbox" id="softClipToggle" checked> Soft Clipping
          </label>
          <label>Soft Clip Knee (threshold):
            <input type="range" id="softClipThreshold" min="-18" max="-0.5" step="0.5" value="-6">
            <span id="softClipThresholdDisplay">-6.0 dBFS</span>
          </label>
          <button id="resetAdvanced">Reset Advanced Controls</button>
        </div>
      </details>
    </section>

    <section id="devControls" class="panel collapsible-panel" hidden>
      <details>
        <summary>🧪 Dev Stress Test</summary>
        <div class="advanced-group">
          <label>Target Input:
            <select id="monoStressInput">
              <option value="0">Input 1</option>
              <option value="1">Input 2</option>
              <option value="2">Input 3</option>
            </select>
          </label>
          <label>Toggle Count:
            <input type="number" id="monoStressCount" min="2" max="100" step="1" value="20">
          </label>
          <button id="runMonoStress">Run Mono Toggle Stress</button>
          <span id="monoStressStatus"></span>
        </div>
      </details>
    </section>

    <section class="panel inputs-panel">
      <h2>Input Channels</h2>
      <div id="sources"></div>
    </section>
  </main>

  <div id="toastContainer" aria-live="polite"></div>

  <script src="./renderer.js"></script>
</body>
</html>
